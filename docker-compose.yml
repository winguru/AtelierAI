services:
  atelier-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        PYTORCH_VARIANT: ${PYTORCH_VARIANT:-auto}
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]
    init: true
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/app:/workspace/app/src:/workspace/app/backend:/workspace/app/dev
      IMAGE_LIBRARY_PATH: /workspace/app/image_library
      IMAGE_RESOURCES_PATH: /workspace/app/image_resources
      DATABASE_URL: sqlite:////workspace/app/image_db.sqlite
      ATELIER_HOST: 0.0.0.0
      ATELIER_PORT: 8000
      ATELIER_RELOAD: 1
      ATELIER_SUPPRESS_STATUS_GET_LOGS: ${ATELIER_SUPPRESS_STATUS_GET_LOGS:-1}

  # Chrome sidecar for the CivitAI browser bridge (CDP + noVNC).
  # Opt-in via the dedicated "browser" profile so standard dev/runtime
  # stacks don't pay the Chromium overhead:
  #   docker compose --profile browser up -d chrome-sidecar
  # Combine with a stack profile as needed:
  #   docker compose --profile dev --profile browser up
  chrome-sidecar:
    profiles: ["browser"]
    build:
      context: ./docker/chrome-sidecar
    init: true
    ports:
      - "127.0.0.1:6080:6080"   # noVNC web UI (localhost-only, no auth — see docs)
    environment:
      SCREEN_WIDTH: ${CHROME_SCREEN_WIDTH:-1440}
      SCREEN_HEIGHT: ${CHROME_SCREEN_HEIGHT:-900}
      # Bind CDP into the host loopback for devcontainer-less local dev.
      # In compose networks the backend reaches the sidecar by service name.
      CDP_PORT: 9222
    volumes:
      - chrome-profile:/data/profile
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9222/json/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  atelier-runtime:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_VARIANT: ${PYTORCH_VARIANT:-auto}
    init: true
    ports:
      - "8000:8000"
    volumes:
      - atelier-runtime-data:/var/lib/atelierai
      - ./image_library:/var/lib/atelierai/image_library
      - ./image_resources:/var/lib/atelierai/image_resources
    environment:
      IMAGE_LIBRARY_PATH: /var/lib/atelierai/image_library
      IMAGE_RESOURCES_PATH: /var/lib/atelierai/image_resources
      DATABASE_URL: sqlite:////var/lib/atelierai/image_db.sqlite
      ATELIER_HOST: 0.0.0.0
      ATELIER_PORT: 8000
      ATELIER_RELOAD: 0
      ATELIER_SUPPRESS_STATUS_GET_LOGS: ${ATELIER_SUPPRESS_STATUS_GET_LOGS:-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  atelier-runtime-data:
  chrome-profile:
